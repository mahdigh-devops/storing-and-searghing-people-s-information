<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>سیستم ثبت و جستجوی افراد</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h1, h2 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            padding: 8px;
            font-size: 16px;
            border-radius: 6px;
            box-shadow: 50px;
            box-shadow: 0 4px 6px 2px rgba(0, 240, 0, 0.411);
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #0da008;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 4px;
            box-shadow: 0 4px 6px 2px rgba(0, 119, 255, 0.411);
            border: 1px solid #000000;
        }
        button:hover {
            background-color: #00ffbf;
            color: #0d0835;
            border-radius: 4px;
        }
        .message {
            color: rgb(38, 0, 255);
            margin-top: 10px;
        }
        .person-info {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            margin-top: 10px;
        }
        ::placeholder {
            color: #000;
        }
    </style>
</head>
<body>

<h1>سیستم ثبت و جستجوی افراد</h1>

<h2>ثبت فرد جدید</h2>
<form id="createForm">
    <input type="text" name="first_name" placeholder="نام" required>
    <input type="text" name="last_name" placeholder="نام خانوادگی" required>
    <input type="text" name="phone" placeholder="شماره تماس" required>
    <input type="text" name="address" placeholder="آدرس" required>
    <input type="text" name="national_id" placeholder="کد ملی" required>
    <button type="submit">ثبت</button>
    <div id="createMessage" class="message"></div>
</form>

<hr>

<h2>جستجو با کد ملی</h2>
<div>
    <input type="text" id="searchNationalId" placeholder="کد ملی">
    <button id="searchBtn">جستجو</button>
    <div id="searchMessage" class="message"></div>
    <div id="personInfo" class="person-info" style="display:none;"></div>
</div>

<script>
const createForm = document.getElementById('createForm');
const createMessage = document.getElementById('createMessage');

createForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    createMessage.textContent = "";
    const formData = {
        first_name: createForm.first_name.value,
        last_name: createForm.last_name.value,
        phone: createForm.phone.value,
        address: createForm.address.value,
        national_id: createForm.national_id.value
    };

    try {
        const res = await fetch("http://localhost:8000/persons", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || "خطا در ثبت اطلاعات");

        createMessage.style.color = "green";
        createMessage.textContent = "ثبت با موفقیت انجام شد!";
        createForm.reset();
    } catch (err) {
        createMessage.style.color = "red";
        createMessage.textContent = err.message;
    }
});

const searchBtn = document.getElementById('searchBtn');
const searchMessage = document.getElementById('searchMessage');
const personInfo = document.getElementById('personInfo');

searchBtn.addEventListener('click', async () => {
    const nationalId = document.getElementById('searchNationalId').value.trim();
    searchMessage.textContent = "";
    personInfo.style.display = "none";
    if (!nationalId) return;

    try {
        const res = await fetch(`http://localhost:8000/persons/${nationalId}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || "فرد پیدا نشد");

        personInfo.innerHTML = `
            <p><strong>نام:</strong> ${data.first_name}</p>
            <p><strong>نام خانوادگی:</strong> ${data.last_name}</p>
            <p><strong>شماره تماس:</strong> ${data.phone}</p>
            <p><strong>آدرس:</strong> ${data.address}</p>
            <p><strong>کد ملی:</strong> ${data.national_id}</p>
        `;
        personInfo.style.display = "block";
    } catch (err) {
        searchMessage.textContent = err.message;
    }
});
</script>

</body>
</html>
