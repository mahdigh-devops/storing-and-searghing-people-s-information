<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>سیستم ثبت و جستجوی افراد</title>
    <link rel="stylesheet" href="m.css">
    <script src="m.js"></script>
</head>
<body>

<h1>سیستم ثبت و جستجوی افراد</h1>

<h2>ثبت فرد جدید</h2>
<form id="createForm">
    <input type="text" name="first_name" placeholder="نام" required>
    <input type="text" name="last_name" placeholder="نام خانوادگی" required>
    <input type="text" name="phone" placeholder="شماره تماس" required>
    <input type="text" name="address" placeholder="آدرس" required>
    <input type="text" name="national_id" placeholder="کد ملی" required>
    <button type="submit">ثبت</button>
    <div id="createMessage" class="message"></div>
</form>

<hr>

<h2>جستجو با کد ملی</h2>
<div>
    <input type="text" id="searchNationalId" placeholder="کد ملی">
    <button id="searchBtn">جستجو</button>
    <div id="searchMessage" class="message"></div>
    <div id="personInfo" class="person-info" style="display:none;"></div>
</div>

</body>
</html>
